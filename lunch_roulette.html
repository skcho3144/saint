<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 뭐 먹지? 🍱 점심 룰렛</title>
<style>
:root{--ink:#554659;--pink:#ff7f9e;--pink2:#ffe0e8;--mint:#b7eddd;--cream:#fffaf0;--gold:#ffcf69;--shadow:0 12px 35px #ad78942b}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:radial-gradient(circle at 15% 10%,#fff3ac 0,transparent 26%),radial-gradient(circle at 90% 20%,#d8f7f0 0,transparent 28%),linear-gradient(155deg,#fff1f4,#fffdf8 60%,#f4edff);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:28px 18px 55px}header{text-align:center;margin-bottom:24px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:3px;color:#ba6886}.title{font-size:clamp(29px,5vw,48px);margin:6px 0 9px;line-height:1.2}.subtitle{margin:0;color:#846f84}main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(330px,1.08fr);gap:22px}.panel{border:2px solid #fff;border-radius:28px;background:#ffffffc9;box-shadow:var(--shadow);padding:23px;backdrop-filter:blur(8px)}h2{font-size:19px;margin:0 0 18px}.label{font-weight:800;font-size:13px;display:block;margin:18px 0 8px}.chiprow{display:flex;gap:8px;flex-wrap:wrap}.chip{border:2px solid #f4dfe7;background:#fff;border-radius:15px;padding:10px 13px;font:inherit;cursor:pointer;color:var(--ink);font-size:13px;font-weight:750;transition:.2s}.chip.active{background:#ffedf1;border-color:var(--pink);transform:translateY(-1px)}.hint{font-size:12px;color:#938493;margin:9px 0 0}.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}input[type=text],input[type=number]{width:100%;border:2px solid #f0e2e7;border-radius:12px;font:inherit;color:var(--ink);background:white;padding:10px;min-width:0}input:focus-visible,button:focus-visible{outline:3px solid #8e80e5;outline-offset:2px}.menu-list{display:grid;gap:9px;margin-top:12px;max-height:310px;overflow:auto;padding:3px}.menu-item{background:#fff;border:1px solid #f5e4eb;border-radius:15px;padding:9px;display:grid;grid-template-columns:1fr 84px auto;gap:7px;align-items:center}.menu-item input{padding:8px;font-size:13px}.remove{background:#fff1f2;color:#c95c74;border:0;border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:900}.small{font-size:11px;color:#927e8b;display:block;margin-bottom:3px}.add{width:100%;background:#fff;border:2px dashed #eab1c1;border-radius:13px;margin-top:10px;padding:10px;cursor:pointer;color:#bb6281;font-weight:800}.options{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.check{font-size:12px;display:flex;align-items:center;gap:6px}.check input{accent-color:#ef7197}.wheel-panel{text-align:center;display:flex;flex-direction:column;align-items:center}.wheel-container{position:relative;width:min(100%,420px);aspect-ratio:1;margin:8px auto 4px}.pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:29px solid #ed658b;filter:drop-shadow(0 3px 1px #b55c7770)}canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 15px #d98ea34d)}.center-dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:65px;height:65px;background:white;border:7px solid #ffddad;border-radius:100%;display:grid;place-items:center;font-size:26px;box-shadow:0 3px 8px #a77b8f3d;pointer-events:none}.spin{background:linear-gradient(110deg,#ff88a6,#ff668f);border:0;color:#fff;border-radius:99px;padding:14px 38px;font-weight:900;font-size:18px;box-shadow:0 7px 0 #e0527a,0 10px 18px #ed6f9650;cursor:pointer;margin:5px 0 12px;transition:transform .15s}.spin:hover:not(:disabled){transform:translateY(-2px)}.spin:disabled{opacity:.55;cursor:wait}.result{width:100%;background:linear-gradient(120deg,#fff0cf,#ffe9f2);padding:18px;border-radius:18px;border:2px solid white;min-height:103px}.result strong{display:block;color:#ad4a76;font-size:24px;margin:5px 0}.result p{margin:0;font-size:13px;color:#887383}.foot{text-align:center;color:#a38494;font-size:12px;margin-top:22px}.legend{font-size:12px;color:#977c8c;margin-top:9px}.empty{color:#b46f85} @media(max-width:790px){main{grid-template-columns:1fr}.wrap{padding:18px 12px}.panel{padding:18px}.wheel-container{max-width:390px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><div class="wrap"><header><div class="eyebrow">✿ LUNCH DATE FOR TWO ✿</div><h1 class="title">🍓 오늘 뭐 먹지? 🍱</h1><p class="subtitle">우리 둘의 점심 고민, 귀여운 룰렛에게 맡겨봐! 💗</p></header>
<main><section class="panel" aria-label="룰렛 설정"><h2>🎀 오늘의 점심 조건</h2><label class="label">🌤️ 오늘 날씨는?</label><div id="weather" class="chiprow" role="group" aria-label="날씨"><button class="chip active" data-weather="sun">☀️ 맑음</button><button class="chip" data-weather="cloud">☁️ 흐림</button><button class="chip" data-weather="rain">🌧️ 비</button><button class="chip" data-weather="cold">❄️ 추움</button><button class="chip" data-weather="hot">🥵 더움</button></div>
<label class="label">👟 얼마나 걸어갈까?</label><div id="distance" class="chiprow" role="group" aria-label="허용 도보 거리"><button class="chip" data-distance="5">5분 이내</button><button class="chip active" data-distance="10">10분 이내</button><button class="chip" data-distance="15">15분 이내</button><button class="chip" data-distance="30">상관없어</button></div>
<label class="label">👭 함께 먹는 두 사람</label><div class="names"><input id="name1" type="text" value="딸기" maxlength="12" aria-label="첫 번째 사람 이름"><input id="name2" type="text" value="복숭아" maxlength="12" aria-label="두 번째 사람 이름"></div><p class="hint">마음에 드는 메뉴에 각자 하트를 눌러주세요. (선택 사항)</p>
<label class="label">🍜 점심 후보 메뉴 <span id="count" style="font-weight:500"></span></label><div id="menuList" class="menu-list"></div><button id="addMenu" class="add">＋ 메뉴 추가하기</button><div class="options"><label class="check"><input id="useWeather" type="checkbox" checked> 날씨 추천 반영</label><label class="check"><input id="useVotes" type="checkbox" checked> 두 사람 취향 반영</label></div><p class="hint">도보 시간을 기준으로 먼 메뉴는 제외하고, 날씨와 하트로 당첨 확률을 조절해요.</p></section>
<section class="panel wheel-panel"><h2>💞 두근두근 런치 룰렛</h2><div class="wheel-container"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="700" height="700" role="img" aria-label="점심 메뉴 룰렛"></canvas><div class="center-dot" aria-hidden="true">🍒</div></div><button class="spin" id="spin">🎲 룰렛 돌리기!</button><div id="result" class="result" role="status" aria-live="polite"><p>두근두근… 오늘의 점심은?</p><strong>메뉴를 골라볼까? ✨</strong><p>조건을 정하고 버튼을 눌러줘!</p></div><div id="legend" class="legend"></div></section></main><div class="foot">Made with ♡ · 거리/날씨는 직접 선택 · 하트는 확률을 높여주지만 당첨을 보장하진 않아요.</div></div>
<script>
(()=>{'use strict';
const colors=['#ffb1c3','#ffe095','#b8e7db','#c6c1f6','#ffcbb0','#bcdcfb','#f7c1e5','#d8ebae','#f9d6a1','#c4e4e0'];
const defaults=[['김치찌개',5,['cold','rain'],true,false],['파스타',10,['sun','cloud'],true,true],['쌀국수',8,['rain','cold'],false,true],['초밥',12,['hot','sun'],true,true],['샐러드',6,['hot','sun'],false,true],['떡볶이',5,['rain','cloud'],true,false],['돈가스',10,['cloud','cold'],true,true],['냉면',12,['hot'],false,true]];
let menus=defaults.map((x,i)=>({id:i+1,name:x[0],min:x[1],weather:x[2],votes:[x[3],x[4]]})),nextId=9,weather='sun',distance=10,angle=0,spinning=false,visible=[];
const $=s=>document.querySelector(s),list=$('#menuList'),canvas=$('#wheel'),ctx=canvas.getContext('2d'),result=$('#result');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderList(){list.innerHTML=menus.map(m=>`<div class="menu-item" data-id="${m.id}"><input class="menu-name" type="text" maxlength="18" value="${esc(m.name)}" aria-label="메뉴 이름"><div><span class="small">🚶 도보(분)</span><input class="menu-min" type="number" min="1" max="30" value="${m.min}" aria-label="도보 시간"></div><button class="remove" aria-label="${esc(m.name)} 삭제">×</button><label class="check"><input class="vote" data-person="0" type="checkbox" ${m.votes[0]?'checked':''}><span class="vname1">💗 딸기</span></label><label class="check"><input class="vote" data-person="1" type="checkbox" ${m.votes[1]?'checked':''}><span class="vname2">💗 복숭아</span></label></div>`).join('');$('#count').textContent=`(${menus.length}/10)`;$('#addMenu').disabled=menus.length>=10;updateNames();rebuild();}
function updateNames(){document.querySelectorAll('.vname1').forEach(n=>n.textContent='💗 '+($('#name1').value.trim()||'첫째'));document.querySelectorAll('.vname2').forEach(n=>n.textContent='💗 '+($('#name2').value.trim()||'둘째'));}
function rebuild(){if(spinning)return;visible=menus.filter(m=>m.name.trim()&&m.min<=distance);draw();$('#legend').textContent=visible.length?`🎯 현재 ${visible.length}개 메뉴가 룰렛에 들어있어요!`:'😿 거리 조건에 맞는 메뉴가 없어요. 거리를 늘리거나 메뉴를 추가해줘!';}
function draw(){const W=canvas.width,c=W/2,r=c-24;ctx.clearRect(0,0,W,W);ctx.save();ctx.translate(c,c);if(!visible.length){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle='#ffe4ee';ctx.fill();ctx.fillStyle='#a87085';ctx.font='bold 33px sans-serif';ctx.textAlign='center';ctx.fillText('메뉴가 없어요 🥺',0,115);ctx.restore();return;}
const step=Math.PI*2/visible.length;visible.forEach((m,i)=>{const start=angle+i*step-Math.PI/2-step/2,end=start+step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,end);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#fffdfa';ctx.lineWidth=6;ctx.stroke();ctx.save();ctx.rotate(start+step/2);ctx.translate(r*.66,0);ctx.rotate(Math.PI/2);ctx.fillStyle='#5e4a5f';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${visible.length>8?23:visible.length>6?26:31}px sans-serif`;let label=m.name.length>8?m.name.slice(0,7)+'…':m.name;ctx.fillText(label,0,0,Math.max(90,r*.61));ctx.restore();});ctx.beginPath();ctx.arc(0,0,r,0,2*Math.PI);ctx.lineWidth=10;ctx.strokeStyle='white';ctx.stroke();ctx.restore();}
function weightedPick(items){const useW=$('#useWeather').checked,useV=$('#useVotes').checked;const weights=items.map(m=>(useW&&m.weather.includes(weather)?2:1)*(useV?1+m.votes.filter(Boolean).length*.65:1));let n=Math.random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<items.length;i++){n-=weights[i];if(n<=0)return i;}return items.length-1;}
function pick(){if(spinning)return;rebuild();if(!visible.length){result.innerHTML='<p>앗! 후보가 비었어요 🥺</p><strong>거리 조건을 바꿔줘!</strong><p>메뉴의 도보 시간도 확인해 봐.</p>';return;}spinning=true;const btn=$('#spin');btn.disabled=true;const items=visible.slice(),idx=weightedPick(items),step=2*Math.PI/items.length;const target=(-idx*step)%(Math.PI*2);const normalize=x=>((x%(2*Math.PI))+2*Math.PI)%(2*Math.PI);const delta=normalize(target-normalize(angle));const start=angle,end=start+Math.PI*2*5+delta,duration=3600,t0=performance.now();result.innerHTML='<p>빙글빙글~ 🍭</p><strong>오늘의 메뉴를 고르는 중!</strong><p>과연 어떤 점심이 나올까?</p>';function frame(now){const t=Math.min(1,(now-t0)/duration),ease=1-Math.pow(1-t,4);angle=start+(end-start)*ease;draw();if(t<1)requestAnimationFrame(frame);else{angle=normalize(end);draw();spinning=false;btn.disabled=false;const m=items[idx],n1=$('#name1').value.trim()||'첫째',n2=$('#name2').value.trim()||'둘째';result.innerHTML=`<p>🎉 ${esc(n1)} &amp; ${esc(n2)}의 점심 당첨!</p><strong>🍽️ ${esc(m.name)} 💕</strong><p>🚶 걸어서 약 ${m.min}분 · 맛있게 먹고 와요!</p>`;}}requestAnimationFrame(frame);}
function bindChips(id,key,callback){$(id).addEventListener('click',e=>{const b=e.target.closest('button[data-'+key+']');if(!b||spinning)return;$(id).querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));callback(b.dataset[key]);});}
bindChips('#weather','weather',v=>weather=v);bindChips('#distance','distance',v=>{distance=+v;rebuild();});list.addEventListener('input',e=>{const row=e.target.closest('.menu-item');if(!row||spinning)return;const m=menus.find(x=>x.id===+row.dataset.id);if(e.target.classList.contains('menu-name'))m.name=e.target.value;if(e.target.classList.contains('menu-min'))m.min=Math.max(1,Math.min(30,+e.target.value||1));rebuild();});list.addEventListener('change',e=>{const row=e.target.closest('.menu-item');if(!row||spinning)return;const m=menus.find(x=>x.id===+row.dataset.id);if(e.target.classList.contains('vote'))m.votes[+e.target.dataset.person]=e.target.checked;});list.addEventListener('click',e=>{if(!e.target.classList.contains('remove')||spinning)return;const id=+e.target.closest('.menu-item').dataset.id;menus=menus.filter(m=>m.id!==id);renderList();});$('#addMenu').addEventListener('click',()=>{if(spinning||menus.length>=10)return;menus.push({id:nextId++,name:'새 메뉴',min:5,weather:[],votes:[false,false]});renderList();list.scrollTop=list.scrollHeight;});['#name1','#name2'].forEach(s=>$(s).addEventListener('input',updateNames));$('#spin').addEventListener('click',pick);renderList();
})();
</script></body></html>
