<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d31"><meta name="description" content="천안시 청년정책 6장 보고자료 - 원본 내용을 유지한 반응형 웹 프레젠테이션"><title>천안시 청년정책 | 반응형 웹 프레젠테이션</title><style>
:root{color-scheme:dark;--bg:#0a1121;--panel:#121e34;--panel2:#192741;--ink:#f2f6fe;--muted:#9eafc6;--stroke:#30405d;--blue:#6eacff;--accent:#ffcc71;--radius:18px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif}body{background:radial-gradient(circle at 69% 15%,#20395b 0,transparent 37%),var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.3}.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100dvh}.side{background:#101d31ee;border-right:1px solid var(--stroke);padding:26px 17px;display:flex;flex-direction:column;gap:20px}.brand{padding:0 9px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.18em}.brand h1{margin:8px 0 8px;font-size:22px;line-height:1.35;letter-spacing:-.05em}.brand p{font-size:12px;line-height:1.7;color:var(--muted);margin:0}.label{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;padding:0 10px}.nav{display:grid;gap:7px}.navbtn{background:transparent;border:1px solid transparent;border-radius:13px;color:#bac9df;padding:12px 10px;display:flex;align-items:center;gap:11px;text-align:left;width:100%;transition:background .15s,border .15s}.navbtn:hover{background:#1b2d48}.navbtn.active{background:#213b61;color:white;border-color:#376ba2}.number{display:grid;place-items:center;font-size:11px;font-weight:800;background:#2b3b54;color:#d7e3f7;width:27px;height:27px;flex:none;border-radius:8px}.active .number{background:#69a9ff;color:#081327}.navtxt{font-size:13px;font-weight:600;line-height:1.3}.asidebottom{margin-top:auto;border-top:1px solid var(--stroke);padding:20px 8px 0;color:var(--muted);font-size:12px;line-height:1.8}.content{min-width:0;display:flex;flex-direction:column;gap:17px;padding:24px clamp(15px,3.4vw,56px) 18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:44px}.crumb{color:#a7b8d1;font-size:13px}.crumb b{color:#fff}.actions{display:flex;gap:8px;align-items:center}.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;min-height:39px;border:1px solid #3e5779;border-radius:10px;color:#e7f0ff;background:#1b2f4c;padding:8px 13px;font-size:12px;font-weight:700;transition:background .15s,transform .15s}.btn:hover{background:#2c4b75;transform:translateY(-1px)}.btn.primary{background:#2678dc;border-color:#318bfa;color:white}.btn.primary:hover{background:#358cf4}.stagewrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px}.stage{width:min(100%,calc((100dvh - 210px)*16/9));aspect-ratio:16/9;max-height:calc(100dvh - 210px);background:white;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 30px 80px #0009;touch-action:pan-y}.stage img{width:100%;height:100%;object-fit:fill;display:block;user-select:none}.stage:after{content:'';position:absolute;inset:0;border:1px solid #ffffff22;border-radius:12px;pointer-events:none}.stage.is-animating img{animation:show .3s ease both}@keyframes show{from{opacity:.55;transform:scale(1.012)}to{opacity:1;transform:scale(1)}}.stage-badge{position:absolute;left:14px;bottom:14px;border-radius:9px;background:#0b1b37dc;color:#fff;font-size:11px;font-weight:800;padding:8px 10px;backdrop-filter:blur(8px)}.video-trigger{position:absolute;right:3.2%;bottom:6%;background:#166acfe8;color:white;border:2px solid white;border-radius:100px;padding:12px 18px;font-weight:800;font-size:13px;box-shadow:0 8px 30px #0007;display:none}.last .video-trigger{display:block}.video-trigger:hover{background:#0653ad}.controls{display:flex;gap:13px;align-items:center;justify-content:center}.counter{min-width:90px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;font-weight:800}.control{border-radius:100px;width:46px;height:46px;border:1px solid #4b6282;background:#203654;color:white;font-size:23px}.control:not(:disabled):hover{background:#305783}.dots{display:flex;gap:8px;justify-content:center}.dot{background:#536781;width:7px;height:7px;border-radius:8px;border:0;padding:0;transition:all .2s}.dot.active{background:#79b7ff;width:28px}.helper{color:#7f95b4;font-size:11px;text-align:center}.progress{height:3px;width:100%;background:#21324b;border-radius:5px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,#63b3ff,#e2b86e);transition:width .24s}.overview{display:none;max-width:1200px;width:100%;margin:auto;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.overview.show{display:grid}.thumb{background:#15263f;padding:9px;border:1px solid #385174;border-radius:13px;text-align:left;color:white;transition:transform .15s}.thumb:hover{transform:translateY(-3px);border-color:#8dbaff}.thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px}.thumb span{display:block;padding:10px 4px 2px;font-weight:700;font-size:13px}.view-overview .stagewrap{display:none}.view-overview .overview{display:grid}.view-overview .bottomline{display:none}.bottomline{width:100%;display:grid;gap:13px}dialog{background:#111e33;border:1px solid #4a6385;color:white;border-radius:20px;padding:17px;width:min(900px,96vw);box-shadow:0 30px 90px #000b}dialog::backdrop{background:#010710d9;backdrop-filter:blur(5px)}.dialogtop{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:13px}.dialogtop strong{font-size:16px}video{display:block;width:100%;max-height:72dvh;border-radius:10px;background:black}.mobile-header,.mobile-nav{display:none}.fullscreen .stage{width:min(100%,calc(95dvh * 16/9));max-height:95dvh}.mobile-nav button{border:0} @media(max-width:1050px){.app{grid-template-columns:220px minmax(0,1fr)}.content{padding:16px}.brand h1{font-size:19px}.overview{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:730px){.app{display:block}.side{display:none}.mobile-header{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;background:#101d31;border-bottom:1px solid var(--stroke)}.mobile-header strong{font-size:15px}.content{padding:14px 12px 78px;gap:16px;min-height:calc(100dvh - 58px)}.topbar{flex-wrap:wrap;gap:8px}.actions{margin-left:auto}.btn{padding:8px 10px;font-size:11px;min-height:35px}.crumb{font-size:12px}.stagewrap{flex:0;min-height:0;gap:18px;margin:auto 0}.stage{width:100%;max-height:none;border-radius:8px}.stage-badge{bottom:8px;left:8px;font-size:9px;padding:5px 7px}.video-trigger{font-size:11px;padding:8px 11px}.controls{gap:22px}.helper{display:none}.overview{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-content:start}.thumb{padding:6px}.thumb span{font-size:11px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:66px;justify-content:space-around;align-items:center;background:#10213af5;border-top:1px solid #385574;z-index:10;padding-bottom:env(safe-area-inset-bottom)}.mobile-nav button{color:#e4f0ff;background:none;font-weight:700;font-size:11px;padding:10px}.mobile-nav button span{display:block;font-size:19px;margin-bottom:3px}.view-overview .overview{display:grid}.bottomline{margin-bottom:4px}}@media(max-width:430px){.mobile-header strong{font-size:13px}.topbar{justify-content:center}.crumb{width:100%;text-align:center}.actions{margin:auto}.overview{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style></head><body><div class="app" id="presentation"><aside class="side" aria-label="슬라이드 탐색"><div class="brand"><span class="eyebrow">CHEONAN · YOUTH POLICY</span><h1>천안시 청년정책</h1><p>6장 보고자료<br>원본 슬라이드 내용 및 디자인 유지</p></div><div class="label">SLIDES / 목차</div><nav class="nav" id="pageNav" aria-label="슬라이드 목차"></nav><div class="asidebottom">화살표 키로 슬라이드 이동<br>모바일에서는 좌우 스와이프</div></aside><header class="mobile-header"><strong>천안시 청년정책</strong><span class="eyebrow">6 SLIDES</span></header><main class="content"><div class="topbar"><div class="crumb">청년정책 보고자료 <span aria-hidden="true">/</span> <b id="crumbTitle">제목</b></div><div class="actions"><button class="btn" id="overviewBtn" aria-pressed="false">▦ 전체 보기</button><button class="btn" id="fullBtn" title="전체화면 보기">⛶ 전체화면</button></div></div><section class="stagewrap" aria-label="발표 슬라이드"><div class="stage" id="stage"><img id="slideImage" alt="천안시 청년정책 첫 번째 슬라이드" draggable="false"><span class="stage-badge" id="stageBadge">01 / 06</span><button class="video-trigger" id="playVideo">▶ 축제 영상 재생</button></div><div class="controls"><button class="control" id="prev" aria-label="이전 슬라이드">‹</button><span class="counter" id="pageCounter" aria-live="polite">1 / 6</span><button class="control" id="next" aria-label="다음 슬라이드">›</button></div><div class="dots" id="dots" aria-label="페이지 바로가기"></div><div class="helper">← → 방향키로 이동 · 슬라이드를 넘기거나 목차에서 선택하세요</div></section><section id="overviewGrid" class="overview" aria-label="전체 슬라이드 미리보기"></section><div class="bottomline"><div class="progress" aria-label="발표 진행률"><span id="progress"></span></div></div></main></div><nav class="mobile-nav" aria-label="모바일 메뉴"><button id="mobilePrev"><span>‹</span>이전</button><button id="mobileOverview"><span>▦</span>전체 보기</button><button id="mobileNext"><span>›</span>다음</button></nav><dialog id="videoDialog" aria-label="첨부된 축제 동영상"><div class="dialogtop"><strong>첨부 축제 동영상</strong><button class="btn" id="closeVideo">✕ 닫기</button></div><video id="festivalVideo" src="festival-video.mp4" controls playsinline preload="metadata"></video></dialog><script>const LABELS=["제목", "정책 추진 배경", "주요 지원내용", "청년에게 제공되는 혜택", "기대효과", "마무리 메시지"];const IMAGE_SOURCES=["slide-1.png", "slide-2.png", "slide-3.png", "slide-4.png", "slide-5.png", "slide-6.png"];
const names=LABELS, sources=IMAGE_SOURCES;
let current=0,overview=false,touchStart=null;
const $=id=>document.getElementById(id),stage=$('stage'),pic=$('slideImage');
function render(){pic.src=sources[current];pic.alt=`원본 PPTX ${current+1}번 슬라이드: ${names[current]}`;$('crumbTitle').textContent=names[current];$('pageCounter').textContent=`${current+1} / 6`;$('progress').style.width=`${(current+1)/6*100}%`;$('stageBadge').textContent=`${String(current+1).padStart(2,'0')} / 06`;
stage.classList.toggle('last',current===5);$('prev').disabled=current===0;$('next').disabled=current===5;
document.querySelectorAll('[data-page]').forEach(el=>{const active=Number(el.dataset.page)===current;el.classList.toggle('active',active);if(el.classList.contains('navbtn'))el.setAttribute('aria-current',active?'step':'false');});stage.classList.remove('is-animating');void stage.offsetWidth;stage.classList.add('is-animating');}
function go(i){current=Math.max(0,Math.min(5,i));overview=false;setMode();render()}
function setMode(){document.body.classList.toggle('view-overview',overview);$('overviewBtn').setAttribute('aria-pressed',String(overview));$('overviewBtn').textContent=overview?'▣ 발표 보기':'▦ 전체 보기';}
function toggleOverview(){overview=!overview;setMode()}
function openVideo(){const d=$('videoDialog');d.showModal();$('festivalVideo').play().catch(()=>{});}
function closeVideo(){const v=$('festivalVideo');v.pause();$('videoDialog').close()}
function toggleFullscreen(){const el=$('presentation');if(!document.fullscreenElement){el.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()}
const nav=$('pageNav'),grid=$('overviewGrid'),dots=$('dots');names.forEach((name,i)=>{const n=document.createElement('button');n.className='navbtn';n.dataset.page=i;n.innerHTML=`<span class="number">${String(i+1).padStart(2,'0')}</span><span class="navtxt">${name}</span>`;n.onclick=()=>go(i);nav.append(n);const c=document.createElement('button');c.className='thumb';c.dataset.page=i;c.innerHTML=`<img loading="lazy" alt="${name} 슬라이드 미리보기"><span>${String(i+1).padStart(2,'0')}. ${name}</span>`;c.querySelector('img').src=sources[i];c.onclick=()=>go(i);grid.append(c);const b=document.createElement('button');b.className='dot';b.dataset.page=i;b.setAttribute('aria-label',`${i+1}번 슬라이드`);b.onclick=()=>go(i);dots.append(b)});
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('overviewBtn').onclick=toggleOverview;$('fullBtn').onclick=toggleFullscreen;$('playVideo').onclick=openVideo;$('closeVideo').onclick=closeVideo;$('videoDialog').addEventListener('click',e=>{if(e.target===$('videoDialog'))closeVideo()});$('videoDialog').addEventListener('close',()=>{$('festivalVideo').pause()});
$('mobilePrev').onclick=()=>go(current-1);$('mobileNext').onclick=()=>go(current+1);$('mobileOverview').onclick=toggleOverview;
document.addEventListener('keydown',e=>{if($('videoDialog').open)return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Escape'&&overview){overview=false;setMode()}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(5)}});
stage.addEventListener('touchstart',e=>{touchStart={x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY}},{passive:true});stage.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].screenX-touchStart.x,dy=e.changedTouches[0].screenY-touchStart.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)go(current+(dx<0?1:-1));touchStart=null},{passive:true});
render();
</script></body></html>
